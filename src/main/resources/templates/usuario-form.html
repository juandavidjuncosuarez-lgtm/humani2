<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HUMANI | Registrar usuario</title>

    <link rel="stylesheet" th:href="@{/css/estilos.css}">

</head>

<body>

<header class="barra-navegacion">

    <div class="contenedor barra-contenido">

        <a href="/" class="logo">
            HUMANI
        </a>

        <nav>

            <a href="/" class="enlace-nav">
                Inicio
            </a>

            <a href="/usuarios" class="enlace-nav activo">
                Usuarios
            </a>

            <a href="/productos" class="enlace-nav">
                Productos
            </a>

        </nav>

    </div>

</header>


<main class="contenedor">

    <section class="formulario-seccion">

        <div class="formulario-cabecera">

            <span class="etiqueta">
                NUEVO REGISTRO
            </span>

            <h1>
                Registrar usuario
            </h1>

            <p>
                Complete los datos para registrar un
                nuevo usuario en HUMANI.
            </p>

        </div>


        <form th:action="@{/usuarios/guardar}"
              th:object="${usuario}"
              method="post"
              class="formulario">


            <div class="campo">

                <label for="nombre">
                    Nombre completo
                </label>

                <input
                        type="text"
                        id="nombre"
                        th:field="*{nombre}"
                        placeholder="Ingrese el nombre completo"
                        required>

            </div>


            <div class="campo">

                <label for="documento">
                    Documento
                </label>

                <input
                        type="text"
                        id="documento"
                        th:field="*{documento}"
                        placeholder="Ingrese el documento"
                        required>

            </div>


            <div class="campo">

                <label for="correo">
                    Correo electrónico
                </label>

                <input
                        type="email"
                        id="correo"
                        th:field="*{correo}"
                        placeholder="ejemplo@correo.com"
                        required>

            </div>


            <div class="formulario-botones">

                <a href="/usuarios"
                   class="boton boton-secundario">

                    Cancelar

                </a>

                <button
                        type="submit"
                        class="boton boton-principal">

                    Guardar usuario

                </button>

            </div>

        </form>

    </section>

</main>


<footer>

    <p>
        © 2026 HUMANI - Sistema de gestión
    </p>

</footer>

</body>

</html>
